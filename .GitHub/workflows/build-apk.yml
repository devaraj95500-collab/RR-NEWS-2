
name: Build RR NEWS Telugu APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android project files
        run: |
          test -f settings.gradle || test -f settings.gradle.kts || { echo "ERROR: settings.gradle not found"; exit 1; }
          test -f app/build.gradle || test -f app/build.gradle.kts || { echo "ERROR: app/build.gradle not found"; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo "ERROR: AndroidManifest.xml not found"; exit 1; }

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RR-NEWS-Telugu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
